<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting OpenSwing</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #0b0b0b;
        color: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 15%, rgb(207 193 140 / 16%), transparent 34%),
          linear-gradient(145deg, #161616 0%, #0b0b0b 72%);
      }

      main {
        width: min(92vw, 680px);
        padding: clamp(28px, 8vh, 44px) clamp(18px, 4vw, 34px);
        text-align: center;
      }

      .logo {
        width: min(70vw, 460px);
        height: auto;
        margin-bottom: clamp(8px, 2vh, 16px);
        filter: drop-shadow(0 14px 32px rgb(0 0 0 / 38%));
      }

      h1 {
        margin: 0;
        color: #cfc18c;
        font-size: clamp(26px, 4.5vw, 38px);
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .message {
        min-height: 1.4em;
        margin: 8px 0 0;
        color: #bdbdbd;
        font-size: clamp(15px, 2.4vw, 19px);
      }

      .components {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 20px auto 0;
        padding: 0;
        list-style: none;
        text-align: left;
      }

      .components:empty {
        display: none;
      }

      .component {
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 9px 12px;
        border: 1px solid rgb(255 255 255 / 8%);
        border-radius: 10px;
        background: rgb(255 255 255 / 4%);
        color: #a6a6a6;
        font-size: 15px;
      }

      .component-state {
        width: 20px;
        height: 20px;
        margin-right: 9px;
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        border: 2px solid #626262;
        border-radius: 50%;
        color: #0b0b0b;
        font-size: 13px;
        font-weight: 800;
      }

      .component.starting {
        color: #ffffff;
        border-color: rgb(207 193 140 / 32%);
      }

      .component.starting .component-state {
        border-color: rgb(207 193 140 / 25%);
        border-top-color: #cfc18c;
        animation: spin 0.9s linear infinite;
      }

      .component.ready {
        color: #ffffff;
      }

      .component.ready .component-state {
        border-color: #cfc18c;
        background: #cfc18c;
      }

      .component.skipped {
        opacity: 0.58;
      }

      .component.error .component-state {
        border-color: #e36565;
        background: #e36565;
      }

      .elapsed {
        min-height: 1.4em;
        margin-top: 16px;
        color: #8a8a8a;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      .error-details {
        margin: 18px auto 0;
        padding: 14px 16px;
        border: 1px solid rgb(227 101 101 / 42%);
        border-radius: 12px;
        background: rgb(111 30 30 / 18%);
        text-align: left;
      }

      .error-details[hidden] {
        display: none;
      }

      .recovery {
        margin: 0;
        color: #f2f2f2;
        font-size: 15px;
        line-height: 1.4;
      }

      .log-location {
        margin: 8px 0 0;
        color: #9a9a9a;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .dismiss {
        display: block;
        min-width: 180px;
        min-height: 44px;
        margin: 14px auto 0;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: #cfc18c;
        color: #0b0b0b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .dismiss:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      body.failed main {
        padding-block: 10px;
      }

      body.failed .logo {
        width: min(56vw, 340px);
        margin-bottom: 4px;
      }

      body.failed h1 {
        font-size: clamp(24px, 4vw, 32px);
      }

      body.failed .components {
        gap: 6px;
        margin-top: 12px;
      }

      body.failed .component {
        padding-block: 7px;
      }

      body.failed .error-details {
        margin-top: 10px;
        padding-block: 10px;
      }

      body.failed .elapsed {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .component.starting .component-state {
          animation-duration: 1.8s;
        }
      }

      @media (max-width: 580px) {
        .components {
          grid-template-columns: 1fr;
        }
      }

      @media (max-height: 430px) {
        main {
          padding-block: 10px;
        }

        .logo {
          width: min(52vw, 320px);
          margin-bottom: 4px;
        }

        h1 {
          font-size: clamp(24px, 4vw, 30px);
        }

        .message {
          margin-top: 4px;
        }

        .components {
          margin-top: 10px;
        }

        .elapsed {
          margin-top: 8px;
        }

        body.failed main {
          padding-block: 4px;
        }

        body.failed .logo {
          width: min(44vw, 260px);
          margin-bottom: 0;
        }

        body.failed h1 {
          font-size: clamp(22px, 3.5vw, 28px);
        }

        body.failed .message {
          margin-top: 2px;
          font-size: 14px;
        }

        body.failed .components {
          gap: 4px;
          margin-top: 8px;
        }

        body.failed .component {
          padding-block: 5px;
        }

        body.failed .error-details {
          margin-top: 6px;
          padding: 8px 12px;
        }

        body.failed .recovery {
          font-size: 14px;
        }

        body.failed .log-location {
          margin-top: 4px;
          font-size: 11px;
        }

        body.failed .dismiss {
          margin-top: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <img class="logo" src="openswing-logo-on-dark-transparent.svg" alt="OpenSwing" />
      <h1 id="heading">Starting OpenSwing</h1>
      <p class="message" id="message">Preparing software and connecting hardware…</p>
      <ul class="components" id="components" aria-label="Startup progress"></ul>
      <section class="error-details" id="error-details" hidden>
        <p class="recovery" id="recovery"></p>
        <p class="log-location">Technician logs: <span id="log-path"></span></p>
        <button class="dismiss" id="dismiss" type="button">Return to desktop</button>
      </section>
      <div class="elapsed" id="elapsed"></div>
    </main>

    <script>
      const targetUrl = new URL(window.location.href).searchParams.get('target') || 'http://localhost:8080';
      const startedAt = Date.now();
      const heading = document.getElementById('heading');
      const elapsed = document.getElementById('elapsed');
      const message = document.getElementById('message');
      const components = document.getElementById('components');
      const errorDetails = document.getElementById('error-details');
      const recovery = document.getElementById('recovery');
      const logPath = document.getElementById('log-path');
      const dismiss = document.getElementById('dismiss');
      const stateSymbols = { waiting: '', starting: '', ready: '✓', skipped: '–', error: '!' };
      let renderedComponentSignature = '';
      let startupFailed = false;

      function updateElapsed() {
        if (startupFailed) {
          elapsed.textContent = 'Startup stopped';
          return;
        }
        const seconds = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
        elapsed.textContent = `Starting… ${seconds}s`;
      }

      async function waitForOpenFlight() {
        if (startupFailed) return;
        try {
          await fetch(targetUrl, { mode: 'no-cors', cache: 'no-store' });
          if (startupFailed) return;
          window.location.replace(targetUrl);
          return;
        } catch {
          window.setTimeout(waitForOpenFlight, 500);
        }
      }

      function renderStatus(status) {
        if (status.version !== 1 || !Array.isArray(status.components)) return;

        if (typeof status.message === 'string') message.textContent = status.message;
        if (status.overall === 'error') {
          startupFailed = true;
          document.body.classList.add('failed');
          heading.textContent = 'OpenSwing couldn’t start';
          recovery.textContent = status.error?.recovery || 'Check the connected hardware.';
          logPath.textContent = status.error?.log_path || 'Terminal logs';
          errorDetails.hidden = false;
          elapsed.textContent = 'Startup stopped';
        }
        const componentSignature = JSON.stringify(status.components);
        if (componentSignature === renderedComponentSignature) return;
        renderedComponentSignature = componentSignature;

        const rows = status.components.map((component) => {
          const state = Object.hasOwn(stateSymbols, component.state) ? component.state : 'waiting';
          const row = document.createElement('li');
          const indicator = document.createElement('span');
          const label = document.createElement('span');

          row.className = `component ${state}`;
          indicator.className = 'component-state';
          indicator.setAttribute('aria-hidden', 'true');
          indicator.textContent = stateSymbols[state];
          label.textContent = component.label;
          row.append(indicator, label);
          return row;
        });
        components.replaceChildren(...rows);
      }

      async function pollStatus() {
        try {
          const response = await fetch('status.json', { cache: 'no-store' });
          if (response.ok) renderStatus(await response.json());
        } catch {
          // The generic preparation message remains until structured status is available.
        }
        if (!startupFailed) window.setTimeout(pollStatus, 250);
      }

      dismiss.addEventListener('click', async () => {
        dismiss.disabled = true;
        dismiss.textContent = 'Closing…';
        try {
          await fetch('/dismiss', { method: 'POST' });
        } catch {
          dismiss.disabled = false;
          dismiss.textContent = 'Press Alt+F4 to close';
        }
      });

      updateElapsed();
      window.setInterval(updateElapsed, 1000);
      pollStatus();
      waitForOpenFlight();
    </script>
  </body>
</html>
